name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
      - name: Tests
        run: pytest
      - name: Flake8
        run: |
          flake8 whisper_fpmi tests main.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 whisper_fpmi tests main.py --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics
