site_name: Лекторий ФПМИ
site_description: Расшифровки лекций ФПМИ и инструменты поверх текстов
site_url: https://mihaham.github.io/Whisper_FPMI/
repo_url: https://github.com/Mihaham/Whisper_FPMI
repo_name: Mihaham/Whisper_FPMI
edit_uri: edit/main/docs/

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Обзор: index.md
  - Идея: idea.md
  - Расшифровка: pipeline.md
  - Датасет: dataset.md
  - Облако слов: wordcloud.md
  - Таймкоды: timecodes.md
  - Граф терминов: graph.md
  - Поиск и RAG: search.md
  - Метрики: metrics.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mihaham/Whisper_FPMI
